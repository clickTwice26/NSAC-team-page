<!-- Section V: Observatory & Colloquium Dispatches Component -->
<section id="dispatches" class="academic-section section-parchment">
  <div class="content-bound">
    <div class="section-label-block">
      <span class="section-roman">SECTION V</span>
      <h2 class="section-title">Observatory Bulletins &amp; Colloquia</h2>
      <div class="title-separator"></div>
    </div>

    <div class="dispatches-grid">
      {% for d in dispatches %}
      <div class="dispatch-card">
        <div class="dispatch-header">
          <span class="dispatch-cat">{{ d.category }}</span>
          <span class="dispatch-date">{{ d.date }}</span>
        </div>
        <h3 class="dispatch-title">{{ d.title }}</h3>
        <p class="dispatch-summary">{{ d.summary }}</p>
        <div class="dispatch-footer">
          <a href="javascript:void(0)" class="dispatch-link">Read Full Bulletin Transcript &rarr;</a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
