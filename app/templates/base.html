<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Laboratory for Deep Space Dynamics & Astrodynamics Computation{% endblock %}</title>
    
    <!-- Academic Fonts: Cormorant Garamond, Newsreader, News Gothic / Inter, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    
    <!-- Static stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', _external=False) }}" />
    {% block extra_head %}{% endblock %}
  </head>
  <body class="academic-body">
    <!-- Top Masthead Ribbon Component -->
    {% include 'components/masthead.html' %}

    <!-- Academic Header & Crest Navigation Component -->
    {% include 'components/header.html' %}

    <!-- Main Academic Body Block -->
    <main class="academic-main-content">
      {% block content %}{% endblock %}
    </main>

    <!-- Collegiate Footer Component -->
    {% include 'components/footer.html' %}

    {% block extra_scripts %}{% endblock %}
  </body>
</html>
