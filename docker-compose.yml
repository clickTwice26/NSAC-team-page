services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team_page_web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8000}
      - REDIS_URL=${REDIS_URL:-redis://:dev_redis_password@redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: team_page_redis
    restart: unless-stopped
    command: >
      sh -c "redis-server --requirepass $${REDIS_PASSWORD:-dev_redis_password}"
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dev_redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_password}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
